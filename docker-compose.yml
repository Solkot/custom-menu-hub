services:
  postgres:
    image: postgres:18
    container_name: cmh-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-custommenuhub}
      POSTGRES_USER: ${POSTGRES_USER:-cmh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8
    container_name: cmh-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
